name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (trustinn-desktop)
        working-directory: ./trustinn-desktop
        run: npm install

      - name: Generate macOS icon
        working-directory: ./trustinn-desktop
        run: npm run generate:icon

      - name: Build macOS DMG
        working-directory: ./trustinn-desktop
        run: npm run build:mac:dmg

      - name: Upload DMG to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: trustinn-desktop/dist/**/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            trustinn-desktop/dist/*.dmg
            trustinn-desktop/dist/*.zip
          retention-days: 30
